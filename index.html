<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Fly Through Toroid</title>
	<meta name="description" content="An interactive 3D toroid made of smaller toroids. Shape it, choose its material, and fly through it.">
	<meta name="color-scheme" content="dark">
	<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='22' fill='none' stroke='%237cc4ff' stroke-width='9'/%3E%3C/svg%3E">
	<link rel="stylesheet" href="css/style.css">
	<script type="importmap">
		{
			"imports": {
				"three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
				"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
			}
		}
	</script>
</head>
<body>
	<div id="app">
		<main id="viewport" data-mode="orbit">
			<canvas id="scene" aria-label="3D view of the toroid"></canvas>

			<div class="hud hud-top">
				<div class="seg" id="modeSeg" role="group" aria-label="Navigation mode">
					<button data-mode="orbit" class="active" title="Orbit around the ring (1)">Orbit</button>
					<button data-mode="fly" title="Free flight (2)">Fly</button>
					<button data-mode="ride" title="Ride through the toroids (3)">Ride through</button>
				</div>
				<div class="hud-actions">
					<button id="btnResetView" class="icon-btn" title="Reset view (R)" aria-label="Reset view">
						<svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4.5h4.5"/></svg>
					</button>
					<button id="btnShot" class="icon-btn" title="Save screenshot (P)" aria-label="Save screenshot">
						<svg viewBox="0 0 24 24"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
					</button>
					<button id="btnPanel" class="icon-btn" title="Show or hide the panel (H)" aria-label="Toggle panel">
						<svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2"/><path d="M14.5 5v14"/></svg>
					</button>
				</div>
			</div>

			<div class="hud hud-bottom" id="hint"></div>

			<div class="loading">Loading 3D scene…</div>
			<div id="fallback" hidden>
				<p>This page needs WebGL 2. Try a current version of Chrome, Edge, Firefox or Safari.</p>
			</div>
		</main>

		<aside id="panel" aria-label="Toroid settings"></aside>
	</div>

	<script type="module" src="js/main.js"></script>
</body>
</html>
